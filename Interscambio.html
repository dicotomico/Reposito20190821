<h1>JavaSritp Loops</h1>
<h2>The do...while Loop</h2>
<script>
<p id="demo"></p>

let text = ""
let i = 0;

do {
  text += "<br>The number is " + i;
  i++;
}
while (i < 10);  

document.getElementById("demo").innerHTML = text;

</script>
